{% extends 'cursos/base.html' %}

{% block body %}
<div class="px-8 py-3">
  <div class="my-6">

    <h1 class="font-semibold py-2 text-xl">Login</h1>
    <form method="POST" class="grid gap-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="text-left border border-black px-2 rounded-lg bg-green-600 w-fit">
        Login
      </button>
    </form>
  </div>

  <a href="{% url 'register' %}" class="mt-6 px-3 py-2 rounded-md text-sm font-medium bg-orange-500 hover:bg-orange-600">
    ¿No ténes cuenta? Registrarse
  </a>
</div>
{% endblock %}
