{% extends './base.html' %}

{% block title %} Eliminar Curso {% endblock %}

{% block body %}
    <h1>Borrar Curso</h1>
    
    <form method="post">
        {% csrf_token %}
        <div>Estas seguro de que quieres eliminar esta tarea</div>
        <h3>
            {{ curso }}
        </h3>

        <button type="submit">Si, Eliminar</button>
        <a href="{% url 'cursos' %}">No, cancelar</a>
    </form>
{% endblock %}
