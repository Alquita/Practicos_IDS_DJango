<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-200">
    <nav class="bg-zinc-700 text-white flex justify-between items-center px-3 py-3">
        <div class="">
            <a href="{% url 'index' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Inicio</a>
            <a href="{% url 'cursos' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Cursos</a>
            {% if user.is_superuser %}
            <a href="{% url 'admin:index' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Admin</a>
            {% endif %}
        </div>

        <div class="flex gap-4 items-center">
            {% if user.is_authenticated %}
            {%if user.foto_perfil%}
            <img src="{{user.foto_perfil.url}}" alt="foto de perfil de {{user.username}}"
            class="rounded-full size-8 ">
            {% else %}
            <p alt="foto de perfil de {{user.username}}" class="rounded-full size-8 border">
            {%endif%}
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Cerrar sesion</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">
                Iniciar sesión
            </a>
            {% endif %}
        </div>



    </nav>
    {% block body %}



    {% endblock %}
</body>

</html>
